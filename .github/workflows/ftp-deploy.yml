name: FTP Deploy

on:
  push:
    branches:
      - main
      - master
      - claude/add-staff-scheduling-WKToL
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        run: |
          for file in index.html app.js styles.css; do
            curl --ipv4 --ftp-pasv --ftp-create-dirs \
              -T "$file" \
              "ftp://${{ secrets.FTP_SERVER }}/leisureworkspace/budgetplanner/${file}" \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --retry 3 --retry-delay 5 \
              --silent --show-error
            echo "Uploaded: $file"
          done
