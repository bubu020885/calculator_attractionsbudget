name: FTP Deploy

on:
  push:
    branches:
      - main
      - master
      - claude/add-staff-scheduling-WKToL
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /leisureworkspace/budgetplanner/
          local-dir: ./
          include: |
            index.html
            app.js
            styles.css
          log-level: standard
